name: Native Staging Builds

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
      build_version:
        description: Optional version override. Defaults to the Flutter pubspec version.
        required: false
        default: ""

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: master
  SCHOOLIC_API_BASE_URL: https://schoolic-api-staging.schoolic-api.workers.dev
  SCHOOLIC_NEON_AUTH_URL: https://ep-billowing-shadow-b56k9cl2.neonauth.c-7.us-east-2.aws.neon.tech/neondb

jobs:
  validate:
    name: Validate API and Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: API type check
        run: pnpm api:typecheck

      - name: API tests
        run: pnpm api:test

      - name: Flutter analyze
        working-directory: apps/flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: pnpm flutter:test

      - name: Validation summary
        run: |
          flutter_version="$(flutter --version | head -n 1)"
          {
            echo "## Validation"
            echo "- API type check: passed"
            echo "- API tests: passed"
            echo "- Flutter analyze: passed"
            echo "- Flutter tests: passed"
            echo "- Flutter: ${flutter_version}"
            echo "- Target: staging"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android APK and AAB
    needs: validate
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Resolve build metadata
        run: |
          pubspec_version="$(awk '/^version:/{print $2}' apps/flutter_app/pubspec.yaml)"
          app_version="${{ inputs.build_version }}"
          if [ -z "$app_version" ]; then
            app_version="${pubspec_version%%+*}"
          fi
          short_sha="${GITHUB_SHA::7}"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=${app_version}+${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_ENV"

      - name: Configure Android signing
        working-directory: apps/flutter_app/android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > schoolic-staging-release.jks
            {
              echo "storeFile=schoolic-staging-release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > key.properties
            echo "ANDROID_SIGNING_STATUS=release-signed with GitHub Actions secrets" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNING_STATUS=development-signed fallback using Flutter debug key" >> "$GITHUB_ENV"
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Build staging release APK
        working-directory: apps/flutter_app
        run: >
          flutter build apk --release
          --build-name="${APP_VERSION}"
          --build-number="${BUILD_NUMBER}"
          --dart-define=API_BASE_URL=${{ env.SCHOOLIC_API_BASE_URL }}
          --dart-define=NEON_AUTH_URL=${{ env.SCHOOLIC_NEON_AUTH_URL }}
          --dart-define=SCHOOLIC_ALLOW_DEV_SIGN_IN=false

      - name: Build staging Android App Bundle
        working-directory: apps/flutter_app
        run: >
          flutter build appbundle --release
          --build-name="${APP_VERSION}"
          --build-number="${BUILD_NUMBER}"
          --dart-define=API_BASE_URL=${{ env.SCHOOLIC_API_BASE_URL }}
          --dart-define=NEON_AUTH_URL=${{ env.SCHOOLIC_NEON_AUTH_URL }}
          --dart-define=SCHOOLIC_ALLOW_DEV_SIGN_IN=false

      - name: Verify and package Android artifacts
        run: |
          mkdir -p artifacts/android-apk artifacts/android-aab /tmp/schoolic-apk-inspect
          apk="apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          aab="apps/flutter_app/build/app/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"

          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$aapt" dump badging "$apk" | tee artifacts/android-apk/apk-badging.txt
          grep "package: name='com.schoolic.schoolic'" artifacts/android-apk/apk-badging.txt

          unzip -q "$apk" -d /tmp/schoolic-apk-inspect
          grep -a -R "https://schoolic-api-staging.schoolic-api.workers.dev" /tmp/schoolic-apk-inspect >/dev/null
          if unzip -l "$apk" | grep -q 'kernel_blob.bin'; then
            echo "Release APK unexpectedly contains debug kernel_blob.bin" >&2
            exit 1
          fi

          cp "$apk" artifacts/android-apk/schoolic-staging-release.apk
          cp "$aab" artifacts/android-aab/schoolic-staging-release.aab
          sha256sum artifacts/android-apk/schoolic-staging-release.apk | tee artifacts/android-apk/SHA256SUMS.txt
          sha256sum artifacts/android-aab/schoolic-staging-release.aab | tee artifacts/android-aab/SHA256SUMS.txt

          cat > artifacts/android-apk/README.txt <<EOF
          Schoolic Android staging APK

          Version: ${BUILD_LABEL}
          Architecture: universal APK
          Environment: staging
          API: https://schoolic-api-staging.schoolic-api.workers.dev
          Auth: staging Neon Auth
          Signing: ${ANDROID_SIGNING_STATUS}

          Install:
          1. Download schoolic-staging-release.apk.
          2. Transfer it to an Android device or emulator.
          3. Allow installation from the chosen source when Android prompts.
          4. Open Schoolic and sign in with staging credentials.

          This is an internal staging build. It is not a Google Play-ready release.
          EOF

          cat > artifacts/android-aab/README.txt <<EOF
          Schoolic Android staging App Bundle

          Version: ${BUILD_LABEL}
          Architecture: Android App Bundle
          Environment: staging
          API: https://schoolic-api-staging.schoolic-api.workers.dev
          Auth: staging Neon Auth
          Signing: ${ANDROID_SIGNING_STATUS}

          The AAB is provided for future distribution testing. It has not been submitted
          to Google Play and should not be treated as Play-ready.
          EOF

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: schoolic-android-apk-staging
          path: artifacts/android-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android AAB
        uses: actions/upload-artifact@v5
        with:
          name: schoolic-android-aab-staging
          path: artifacts/android-aab/
          if-no-files-found: error
          retention-days: 14

      - name: Android summary
        run: |
          apk_size="$(du -h artifacts/android-apk/schoolic-staging-release.apk | cut -f1)"
          aab_size="$(du -h artifacts/android-aab/schoolic-staging-release.aab | cut -f1)"
          apk_sha="$(cut -d' ' -f1 artifacts/android-apk/SHA256SUMS.txt)"
          aab_sha="$(cut -d' ' -f1 artifacts/android-aab/SHA256SUMS.txt)"
          {
            echo "## Android"
            echo "- Version: ${BUILD_LABEL}"
            echo "- APK artifact: schoolic-android-apk-staging"
            echo "- APK size: ${apk_size}"
            echo "- APK SHA-256: ${apk_sha}"
            echo "- AAB artifact: schoolic-android-aab-staging"
            echo "- AAB size: ${aab_size}"
            echo "- AAB SHA-256: ${aab_sha}"
            echo "- Signing: ${ANDROID_SIGNING_STATUS}"
            echo "- Environment: staging"
            echo "- Runner: ubuntu-latest"
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows ZIP and Installer
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Resolve build metadata
        shell: pwsh
        run: |
          $pubspecVersion = (Select-String -Path "apps/flutter_app/pubspec.yaml" -Pattern "^version:\s*(.+)$").Matches[0].Groups[1].Value.Trim()
          $appVersion = "${{ inputs.build_version }}"
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            $appVersion = $pubspecVersion.Split("+")[0]
          }
          $shortSha = "${env:GITHUB_SHA}".Substring(0, 7)
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "BUILD_NUMBER=${env:GITHUB_RUN_NUMBER}" >> $env:GITHUB_ENV
          "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
          "BUILD_LABEL=$appVersion+${env:GITHUB_RUN_NUMBER}.$shortSha" >> $env:GITHUB_ENV

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build staging Windows app
        working-directory: apps/flutter_app
        run: >
          flutter build windows --release
          --build-name="${{ env.APP_VERSION }}"
          --build-number="${{ env.BUILD_NUMBER }}"
          --dart-define=API_BASE_URL=${{ env.SCHOOLIC_API_BASE_URL }}
          --dart-define=NEON_AUTH_URL=${{ env.SCHOOLIC_NEON_AUTH_URL }}
          --dart-define=SCHOOLIC_ALLOW_DEV_SIGN_IN=false

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $release = "apps/flutter_app/build/windows/x64/runner/Release"
          $artifact = "artifacts/windows"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          @"
          Schoolic Windows staging ZIP

          Version: $env:BUILD_LABEL
          Architecture: Windows x64
          Environment: staging
          API: https://schoolic-api-staging.schoolic-api.workers.dev
          Auth: staging Neon Auth

          Run:
          1. Extract schoolic-windows-staging.zip.
          2. Keep the extracted files together in the same directory.
          3. Launch schoolic.exe.
          4. Sign in with staging credentials.

          This bundle is not code-signed. Windows may show an untrusted-app warning.
          "@ | Out-File -FilePath "$release/README.txt" -Encoding utf8
          Compress-Archive -Path "$release/*" -DestinationPath "$artifact/schoolic-windows-staging.zip" -Force
          Get-FileHash "$artifact/schoolic-windows-staging.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  schoolic-windows-staging.zip" } |
            Out-File -FilePath "$artifact/SHA256SUMS.txt" -Encoding ascii
          Copy-Item "$release/README.txt" "$artifact/README.txt"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $release = (Resolve-Path "apps/flutter_app/build/windows/x64/runner/Release").Path
          $installerArtifact = (New-Item -ItemType Directory -Force -Path "artifacts/windows-installer").FullName
          $env:SCHOOLIC_APP_VERSION = $env:APP_VERSION
          $env:SCHOOLIC_WINDOWS_RELEASE_DIR = $release
          $env:SCHOOLIC_WINDOWS_ARTIFACT_DIR = $installerArtifact
          $env:SCHOOLIC_WINDOWS_ICON_FILE = (Resolve-Path "apps/flutter_app/windows/runner/resources/app_icon.ico").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "apps/flutter_app/windows/installer/schoolic-staging.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "$installerArtifact/schoolic-windows-staging-setup.exe"
          if (!(Test-Path $setup)) { throw "Installer was not created." }
          Get-FileHash $setup -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  schoolic-windows-staging-setup.exe" } |
            Out-File -FilePath "$installerArtifact/SHA256SUMS.txt" -Encoding ascii
          @"
          Schoolic Windows staging installer

          Version: $env:BUILD_LABEL
          Architecture: Windows x64
          Environment: staging
          API: https://schoolic-api-staging.schoolic-api.workers.dev
          Auth: staging Neon Auth

          Install:
          1. Run schoolic-windows-staging-setup.exe.
          2. Complete the installer.
          3. Launch Schoolic Staging from the Start Menu.

          Remove:
          Use Windows Apps settings or the Schoolic Staging uninstaller.

          This installer is not code-signed. Windows may show an untrusted-app warning.
          "@ | Out-File -FilePath "$installerArtifact/README.txt" -Encoding utf8

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = "artifacts/windows-installer/schoolic-windows-staging-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "SchoolicStagingInstall"
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$installDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$installDir/schoolic.exe")) { throw "Installed executable was not found." }
          if (!(Test-Path "$installDir/flutter_windows.dll")) { throw "Flutter runtime DLL was not found." }
          & "$installDir/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v5
        with:
          name: schoolic-windows-staging
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: schoolic-windows-installer-staging
          path: artifacts/windows-installer/
          if-no-files-found: error
          retention-days: 14

      - name: Windows summary
        shell: pwsh
        run: |
          $zipSize = [Math]::Round((Get-Item "artifacts/windows/schoolic-windows-staging.zip").Length / 1MB, 2)
          $setupSize = [Math]::Round((Get-Item "artifacts/windows-installer/schoolic-windows-staging-setup.exe").Length / 1MB, 2)
          $zipSha = (Get-Content "artifacts/windows/SHA256SUMS.txt").Split(" ")[0]
          $setupSha = (Get-Content "artifacts/windows-installer/SHA256SUMS.txt").Split(" ")[0]
          "## Windows" >> $env:GITHUB_STEP_SUMMARY
          "- Version: $env:BUILD_LABEL" >> $env:GITHUB_STEP_SUMMARY
          "- ZIP artifact: schoolic-windows-staging" >> $env:GITHUB_STEP_SUMMARY
          "- ZIP size: ${zipSize} MB" >> $env:GITHUB_STEP_SUMMARY
          "- ZIP SHA-256: $zipSha" >> $env:GITHUB_STEP_SUMMARY
          "- Installer artifact: schoolic-windows-installer-staging" >> $env:GITHUB_STEP_SUMMARY
          "- Installer size: ${setupSize} MB" >> $env:GITHUB_STEP_SUMMARY
          "- Installer SHA-256: $setupSha" >> $env:GITHUB_STEP_SUMMARY
          "- Signing: unsigned installer" >> $env:GITHUB_STEP_SUMMARY
          "- Installer check: silent install/uninstall verified on windows-latest" >> $env:GITHUB_STEP_SUMMARY

  linux:
    name: Linux TAR.GZ and DEB
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Resolve build metadata
        run: |
          pubspec_version="$(awk '/^version:/{print $2}' apps/flutter_app/pubspec.yaml)"
          app_version="${{ inputs.build_version }}"
          if [ -z "$app_version" ]; then
            app_version="${pubspec_version%%+*}"
          fi
          short_sha="${GITHUB_SHA::7}"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=${app_version}+${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_ENV"
          deb_version="${app_version}+${GITHUB_RUN_NUMBER}.${short_sha}"
          echo "DEB_VERSION=$deb_version" >> "$GITHUB_ENV"

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build staging Linux app
        working-directory: apps/flutter_app
        run: >
          flutter build linux --release
          --build-name="${APP_VERSION}"
          --build-number="${BUILD_NUMBER}"
          --dart-define=API_BASE_URL=${{ env.SCHOOLIC_API_BASE_URL }}
          --dart-define=NEON_AUTH_URL=${{ env.SCHOOLIC_NEON_AUTH_URL }}
          --dart-define=SCHOOLIC_ALLOW_DEV_SIGN_IN=false

      - name: Package Linux TAR.GZ
        run: |
          mkdir -p artifacts/linux
          bundle="apps/flutter_app/build/linux/x64/release/bundle"
          cat > "$bundle/README.txt" <<EOF
          Schoolic Linux staging TAR.GZ

          Version: ${BUILD_LABEL}
          Architecture: Linux x64
          Environment: staging
          API: https://schoolic-api-staging.schoolic-api.workers.dev
          Auth: staging Neon Auth

          Run:
          1. Extract schoolic-linux-staging.tar.gz.
          2. Keep the extracted files together in the same directory.
          3. Run ./schoolic from the extracted bundle.
          4. Sign in with staging credentials.

          Target: Linux x64 on the GitHub ubuntu-latest runner. Compatible systems
          need GTK 3, glibc, libstdc++, and standard desktop runtime libraries.
          EOF
          tar -czf artifacts/linux/schoolic-linux-staging.tar.gz -C "$bundle" .
          sha256sum artifacts/linux/schoolic-linux-staging.tar.gz | tee artifacts/linux/SHA256SUMS.txt
          cp "$bundle/README.txt" artifacts/linux/README.txt

      - name: Package Linux DEB
        run: |
          package_root="/tmp/schoolic-deb"
          bundle="apps/flutter_app/build/linux/x64/release/bundle"
          mkdir -p artifacts/linux-deb "$package_root/DEBIAN" "$package_root/opt/schoolic-staging" "$package_root/usr/share/applications" "$package_root/usr/share/pixmaps"
          cp -a "$bundle/." "$package_root/opt/schoolic-staging/"
          cp apps/flutter_app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "$package_root/usr/share/pixmaps/schoolic-staging.png"
          cat > "$package_root/usr/share/applications/schoolic-staging.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Schoolic Staging
          Comment=Schoolic internal staging build
          Exec=/opt/schoolic-staging/schoolic
          Icon=schoolic-staging
          Terminal=false
          Categories=Education;
          StartupNotify=true
          EOF
          installed_size="$(du -sk "$package_root" | cut -f1)"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: schoolic-staging
          Version: ${DEB_VERSION}
          Section: education
          Priority: optional
          Architecture: amd64
          Installed-Size: ${installed_size}
          Maintainer: Schoolic <support@schoolic.local>
          Depends: libc6, libstdc++6, libgtk-3-0t64 | libgtk-3-0, libglib2.0-0t64 | libglib2.0-0, liblzma5
          Description: Schoolic internal staging desktop build
           Schoolic native Linux package for internal staging validation.
          EOF
          dpkg-deb --build "$package_root" artifacts/linux-deb/schoolic-linux-staging.deb
          sha256sum artifacts/linux-deb/schoolic-linux-staging.deb | tee artifacts/linux-deb/SHA256SUMS.txt
          cat > artifacts/linux-deb/README.txt <<EOF
          Schoolic Linux staging DEB

          Version: ${BUILD_LABEL}
          Architecture: amd64
          Environment: staging
          API: https://schoolic-api-staging.schoolic-api.workers.dev
          Auth: staging Neon Auth

          Install:
          sudo apt install ./schoolic-linux-staging.deb

          Run:
          Launch "Schoolic Staging" from the application menu, or run:
          /opt/schoolic-staging/schoolic

          Remove:
          sudo apt remove schoolic-staging

          Dependencies: libc6, libstdc++6, GTK 3, glib2, liblzma5.
          Target assumption: compatible Debian/Ubuntu x64 systems, including Pop!_OS.
          EOF

      - name: Verify Linux DEB
        run: |
          dpkg-deb --info artifacts/linux-deb/schoolic-linux-staging.deb
          dpkg-deb --contents artifacts/linux-deb/schoolic-linux-staging.deb | tee artifacts/linux-deb/CONTENTS.txt
          grep '/opt/schoolic-staging/schoolic$' artifacts/linux-deb/CONTENTS.txt
          grep '/usr/share/applications/schoolic-staging.desktop$' artifacts/linux-deb/CONTENTS.txt
          sudo apt-get install -y ./artifacts/linux-deb/schoolic-linux-staging.deb
          dpkg -s schoolic-staging
          test -x /opt/schoolic-staging/schoolic
          sudo apt-get remove -y schoolic-staging

      - name: Upload Linux TAR.GZ
        uses: actions/upload-artifact@v5
        with:
          name: schoolic-linux-staging
          path: artifacts/linux/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v5
        with:
          name: schoolic-linux-deb-staging
          path: artifacts/linux-deb/
          if-no-files-found: error
          retention-days: 14

      - name: Linux summary
        run: |
          tar_size="$(du -h artifacts/linux/schoolic-linux-staging.tar.gz | cut -f1)"
          deb_size="$(du -h artifacts/linux-deb/schoolic-linux-staging.deb | cut -f1)"
          tar_sha="$(cut -d' ' -f1 artifacts/linux/SHA256SUMS.txt)"
          deb_sha="$(cut -d' ' -f1 artifacts/linux-deb/SHA256SUMS.txt)"
          {
            echo "## Linux"
            echo "- Version: ${BUILD_LABEL}"
            echo "- TAR.GZ artifact: schoolic-linux-staging"
            echo "- TAR.GZ size: ${tar_size}"
            echo "- TAR.GZ SHA-256: ${tar_sha}"
            echo "- DEB artifact: schoolic-linux-deb-staging"
            echo "- DEB size: ${deb_size}"
            echo "- DEB SHA-256: ${deb_sha}"
            echo "- DEB dependencies: libc6, libstdc++6, GTK 3, glib2, liblzma5"
            echo "- DEB check: package metadata, contents, install, and remove verified on ubuntu-latest"
            echo "- Environment: staging"
          } >> "$GITHUB_STEP_SUMMARY"
